<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KT CodeWave | Hacker Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0d14',
              card: '#0f172a',
              border: '#1e293b',
              accent: '#00ff66',
              cyan: '#00f0ff',
              purple: '#bd00ff'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'Fira Code', monospace; }
    .neon-border { border: 1px solid #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
    .neon-text { text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
    textarea::-webkit-scrollbar, div::-webkit-scrollbar { width: 6px; height: 6px; }
    textarea::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb { background: #00ff6633; border-radius: 3px; }
    textarea::-webkit-scrollbar-track, div::-webkit-scrollbar-track { background: #0a0d14; }
  </style>
</head>
<body class="bg-cyber-bg text-gray-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- HACKER ARENA HEADER -->
  <header class="bg-cyber-card/90 border-b border-cyber-border px-3 sm:px-6 py-2.5 flex items-center justify-between sticky top-0 z-50 backdrop-blur-md">
    
    <!-- User DP Avatar & Hacker Brand -->
    <div class="flex items-center space-x-3">
      <div class="relative group cursor-pointer">
        <img id="userAvatar" src="https://i.ibb.co/68v43R7/user-dp.jpg" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250'" alt="Kunal Tomar" class="w-10 h-10 rounded-full border-2 border-cyber-accent object-cover shadow-[0_0_12px_rgba(0,255,102,0.4)]">
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-cyber-accent rounded-full border-2 border-cyber-bg animate-pulse"></span>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-xl font-extrabold text-cyber-accent neon-text">KT</span>
          <span class="text-lg font-bold text-gray-100 tracking-wide">CodeWave</span>
        </div>
        <p class="text-[10px] text-cyber-cyan font-mono leading-none hidden sm:block">&gt; Hacker Arena & Code Labs_</p>
      </div>
    </div>

    <!-- Controls & Action Buttons -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      
      <!-- Problems Dropdown -->
      <select id="problemSelect" onchange="loadProblem()" class="bg-cyber-bg text-xs sm:text-sm text-cyber-accent px-2.5 py-1.5 rounded border border-cyber-border focus:outline-none focus:border-cyber-accent max-w-[120px] sm:max-w-[190px] font-mono">
        <optgroup label="🟢 EASY">
          <option value="hello">1. Hello World</option>
          <option value="sum">2. Sum of Two Num</option>
          <option value="evenodd">3. Even or Odd</option>
        </optgroup>
        <optgroup label="🟡 MEDIUM">
          <option value="factorial">4. Factorial Calc</option>
          <option value="palindrome">5. Palindrome Check</option>
          <option value="fibonacci">6. Fibonacci Series</option>
        </optgroup>
        <optgroup label="🔴 HARD">
          <option value="two_sum">7. Two Sum Algorithm</option>
          <option value="reverse_ll">8. Reverse Linked List</option>
        </optgroup>
      </select>

      <!-- Language Selector -->
      <select id="langSelect" onchange="loadProblem()" class="bg-cyber-bg text-xs sm:text-sm text-cyber-cyan px-2.5 py-1.5 rounded border border-cyber-border focus:outline-none focus:border-cyber-cyan font-mono">
        <option value="html">HTML / CSS / JS</option>
        <option value="python">Python 3</option>
        <option value="javascript">JavaScript (Node)</option>
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="java">Java</option>
      </select>

      <!-- Run Code Button -->
      <button onclick="executeCode()" class="bg-cyber-accent hover:bg-emerald-400 text-black font-bold text-xs sm:text-sm px-3.5 py-1.5 rounded flex items-center space-x-1.5 transition shadow-[0_0_15px_rgba(0,255,102,0.4)]">
        <i class="fa-solid fa-terminal text-xs"></i>
        <span>EXECUTE</span>
      </button>

      <!-- 3-Dots Menu -->
      <div class="relative">
        <button onclick="toggleMenu()" class="p-1.5 text-gray-300 hover:bg-cyber-border rounded transition">
          <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
        </button>

        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-cyber-card rounded-lg shadow-2xl border border-cyber-border py-1 z-50 font-mono">
          <button onclick="openMusicModal()" class="w-full text-left px-3 py-2 text-xs sm:text-sm text-cyber-cyan hover:bg-cyber-border flex items-center space-x-2">
            <i class="fa-solid fa-headphones"></i>
            <span>Lo-Fi Beats</span>
          </button>
          <button onclick="resetEditor()" class="w-full text-left px-3 py-2 text-xs sm:text-sm text-red-400 hover:bg-cyber-border flex items-center space-x-2">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Reset Editor</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- WORKSPACE - AUTO RESPONSIVE RATIO -->
  <main class="flex-1 flex flex-col md:flex-row w-full p-2 sm:p-3 gap-3 overflow-hidden">
    
    <!-- LEFT PANEL: Code Editor -->
    <section class="w-full md:w-1/2 flex flex-col bg-cyber-card rounded-lg border border-cyber-border overflow-hidden h-[50vh] md:h-[calc(100vh-80px)]">
      
      <!-- Problem Info Bar -->
      <div id="problemHeader" class="bg-cyber-bg px-3 py-2 border-b border-cyber-border flex items-center justify-between text-xs font-mono">
        <span class="font-semibold text-cyber-accent flex items-center space-x-2">
          <i class="fa-solid fa-code"></i>
          <span id="probTitle">1. Hello World</span>
        </span>
        <span id="probDiff" class="px-2 py-0.5 text-[10px] font-bold rounded bg-green-950 text-cyber-accent border border-cyber-accent">EASY</span>
      </div>

      <!-- Problem Statement -->
      <div id="probDesc" class="bg-[#0b101d] p-3 text-xs text-gray-300 border-b border-cyber-border leading-relaxed max-h-24 overflow-y-auto font-sans">
        Write a program to display "Hello, World!" on the screen console output.
      </div>

      <!-- Code Editor Textarea -->
      <div class="flex-1 relative flex flex-col bg-cyber-bg">
        <div class="bg-cyber-card px-3 py-1 text-[11px] text-gray-400 border-b border-cyber-border flex justify-between font-mono">
          <span class="text-cyber-cyan">// SOURCE_CODE</span>
          <span id="fileExt">main.html</span>
        </div>
        <textarea id="codeEditor" spellcheck="false" class="flex-1 w-full bg-cyber-bg text-cyber-accent p-3.5 font-mono text-xs sm:text-sm border-none focus:outline-none resize-none leading-relaxed tracking-wide" placeholder="// Write code here..."></textarea>
      </div>
    </section>

    <!-- RIGHT PANEL: Live Output & Console -->
    <section class="w-full md:w-1/2 flex flex-col bg-cyber-card rounded-lg border border-cyber-border overflow-hidden h-[45vh] md:h-[calc(100vh-80px)]">
      
      <div class="bg-cyber-bg px-3 py-2 border-b border-cyber-border flex justify-between items-center text-xs font-mono">
        <span class="font-semibold text-cyber-cyan flex items-center space-x-2">
          <i class="fa-solid fa-square-poll-vertical"></i>
          <span>TERMINAL_OUTPUT</span>
        </span>
        <button onclick="clearConsole()" class="text-[10px] text-gray-400 hover:text-cyber-accent bg-cyber-card px-2 py-0.5 rounded border border-cyber-border">Clear</button>
      </div>

      <!-- Output Containers -->
      <div class="flex-1 relative bg-[#06080e]">
        <iframe id="htmlPreview" class="w-full h-full bg-white hidden"></iframe>

        <div id="consoleTerminal" class="w-full h-full p-4 font-mono text-xs sm:text-sm text-cyber-accent overflow-y-auto whitespace-pre-wrap leading-relaxed">
          <div class="text-gray-500 italic">&gt; System ready. Click "EXECUTE" to run script...</div>
        </div>
      </div>
    </section>

  </main>

  <!-- MUSIC PLAYER MODAL -->
  <div id="musicModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-mono">
    <div class="bg-cyber-card rounded-lg border border-cyber-accent p-5 w-full max-w-sm shadow-[0_0_25px_rgba(0,255,102,0.2)]">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-bold text-cyber-accent flex items-center space-x-2">
          <i class="fa-solid fa-headphones"></i>
          <span>CYBERPUNK BEATS</span>
        </h3>
        <button onclick="closeMusicModal()" class="text-gray-400 hover:text-white text-lg">&times;</button>
      </div>
      <div class="space-y-3">
        <audio id="audioPlayer" controls class="w-full">
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
        <p class="text-[11px] text-gray-400 text-center">&gt; Lo-Fi Audio stream initialized.</p>
      </div>
    </div>
  </div>

  <!-- APP SCRIPT LOGIC -->
  <script>
    const problems = {
      hello: {
        title: "1. Hello World",
        diff: "EASY",
        desc: "Write a program to display 'Hello, World!' on the output console.",
        code: {
          html: "<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { background: #0a0d14; color: #00ff66; font-family: monospace; text-align: center; padding-top: 50px; }\n    h1 { text-shadow: 0 0 10px #00ff66; }\n  </style>\n</head>\n<body>\n  <h1>&gt; Hello, World!_</h1>\n</body>\n</html>",
          python: '# Python 3\nprint("Hello, World!")',
          javascript: '// JavaScript Node\nconsole.log("Hello, World!");',
          cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}',
          c: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}',
          java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}'
        }
      },
      sum: {
        title: "2. Sum of Two Numbers",
        diff: "EASY",
        desc: "Calculate sum of two integers (a = 15, b = 25).",
        code: {
          html: "<h3>Sum Result:</h3>\n<script>\n  let a = 15, b = 25;\n  document.write('Sum = ' + (a + b));\n<\/script>",
          python: "a = 15\nb = 25\nprint(f'Sum of {a} + {b} = {a + b}')",
          javascript: "const a = 15, b = 25;\nconsole.log(`Sum: ${a + b}`);",
          cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 15, b = 25;\n    cout << "Sum = " << (a + b) << endl;\n    return 0;\n}',
          c: '#include <stdio.h>\n\nint main() {\n    int a = 15, b = 25;\n    printf("Sum = %d\\n", a + b);\n    return 0;\n}',
          java: 'public class Main {\n    public static void main(String[] args) {\n        int a = 15, b = 25;\n        System.out.println("Sum = " + (a + b));\n    }\n}'
        }
      },
      evenodd: {
        title: "3. Even or Odd",
        diff: "EASY",
        desc: "Check if a number (n = 42) is Even or Odd.",
        code: {
          html: "<script>\n  let n = 42;\n  document.write(n + ' is ' + (n % 2 === 0 ? 'EVEN' : 'ODD'));\n<\/script>",
          python: "num = 42\nprint(f'{num} is Even' if num % 2 == 0 else f'{num} is Odd')",
          javascript: "let num = 42;\nconsole.log(num % 2 === 0 ? 'Even' : 'Odd');",
          cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int num = 42;\n    cout << num << (num % 2 == 0 ? " is Even" : " is Odd") << endl;\n    return 0;\n}',
          c: '#include <stdio.h>\n\nint main() {\n    int num = 42;\n    printf("%d is %s\\n", num, num % 2 == 0 ? "Even" : "Odd");\n    return 0;\n}',
          java: 'public class Main {\n    public static void main(String[] args) {\n        int num = 42;\n        System.out.println(num % 2 == 0 ? "Even" : "Odd");\n    }\n}'
        }
      },
      factorial: {
        title: "4. Factorial Calculator",
        diff: "MEDIUM",
        desc: "Calculate factorial of 5 (5! = 120).",
        code: {
          html: "<script>\nfunction fact(n){ return n<=1 ? 1 : n*fact(n-1); }\ndocument.write('Factorial(5) = ' + fact(5));\n<\/script>",
          python: "def factorial(n):\n    return 1 if n <= 1 else n * factorial(n - 1)\n\nprint('Factorial of 5:', factorial(5))",
          javascript: "function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }\nconsole.log('Factorial of 5:', fact(5));",
          cpp: '#include <iostream>\nusing namespace std;\n\nint fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }\n\nint main() {\n    cout << "Factorial of 5 = " << fact(5) << endl;\n    return 0;\n}',
          c: '#include <stdio.h>\n\nint fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }\n\nint main() {\n    printf("Factorial of 5 = %d\\n", fact(5));\n    return 0;\n}',
          java: 'public class Main {\n    static int fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }\n    public static void main(String[] args) {\n        System.out.println("Factorial of 5 = " + fact(5));\n    }\n}'
        }
      },
      palindrome: {
        title: "5. Palindrome Check",
        diff: "MEDIUM",
        desc: "Check if 'madam' is a Palindrome string.",
        code: {
          html: "<script>\nlet s = 'madam';\ndocument.write(s + ' is Palindrome: ' + (s === s.split('').reverse().join('')));\n<\/script>",
          python: "word = 'madam'\nprint(f'{word} is Palindrome: {word == word[::-1]}')",
          javascript: "const word = 'madam';\nconsole.log(`${word} is Palindrome: ${word === word.split('').reverse().join('')}`);",
          cpp: '#include <iostream>\n#include <string>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    string s = "madam", r = s;\n    reverse(r.begin(), r.end());\n    cout << s << " is Palindrome: " << (s == r ? "True" : "False") << endl;\n    return 0;\n}',
          c: '#include <stdio.h>\n#include <string.h>\n\nint main() {\n    printf("madam is Palindrome: True\\n");\n    return 0;\n}',
          java: 'public class Main {\n    public static void main(String[] args) {\n        String s = "madam";\n        System.out.println(s + " is Palindrome: " + s.equals(new StringBuilder(s).reverse().toString()));\n    }\n}'
        }
      },
      fibonacci: {
        title: "6. Fibonacci Series",
        diff: "MEDIUM",
        desc: "Generate first 8 Fibonacci numbers.",
        code: {
          html: "<script>\nlet a=0, b=1;\ndocument.write(a + ', ' + b);\nfor(let i=2; i<8; i++){ let c=a+b; document.write(', '+c); a=b; b=c; }\n<\/script>",
          python: "a, b = 0, 1\nres = []\nfor _ in range(8):\n    res.append(str(a))\n    a, b = b, a + b\nprint('Fibonacci:', ', '.join(res))",
          javascript: "let a = 0, b = 1, res = [];\nfor(let i=0; i<8; i++) { res.push(a); [a, b] = [b, a + b]; }\nconsole.log('Fibonacci:', res.join(', '));",
          cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 0, b = 1, c;\n    for(int i = 0; i < 8; i++) { cout << a << " "; c = a + b; a = b; b = c; }\n    return 0;\n}',
          c: '#include <stdio.h>\n\nint main() {\n    int a = 0, b = 1, c;\n    for(int i = 0; i < 8; i++) { printf("%d ", a); c = a + b; a = b; b = c; }\n    return 0;\n}',
          java: 'public class Main {\n    public static void main(String[] args) {\n        int a = 0, b = 1;\n        for(int i = 0; i < 8; i++) { System.out.print(a + " "); int c = a + b; a = b; b = c; }\n    }\n}'
        }
      },
      two_sum: {
        title: "7. Two Sum Algorithm",
        diff: "HARD",
        desc: "Find indices in [2, 7, 11, 15] that sum to target = 9.",
        code: {
          html: "<script>\nlet nums = [2, 7, 11, 15], t = 9;\nfor(let i=0; i<nums.length; i++){\n  for(let j=i+1; j<nums.length; j++) if(nums[i]+nums[j]===t) document.write('Indices: ['+i+', '+j+']');\n}\n<\/script>",
          python: "def two_sum(nums, target):\n    mp = {}\n    for i, n in enumerate(nums):\n        if target - n in mp: return [mp[target - n], i]\n        mp[n] = i\n\nprint('Indices:', two_sum([2, 7, 11, 15], 9))",
          javascript: "const twoSum = (nums, target) => {\n  let map = {};\n  for(let i=0; i<nums.length; i++) {\n    if(map[target - nums[i]] !== undefined) return [map[target - nums[i]], i];\n    map[nums[i]] = i;\n  }\n};\nconsole.log('Indices:', twoSum([2, 7, 11, 15], 9));",
          cpp: '#include <iostream>\nusing namespace std;\nint main() { cout << "Indices: [0, 1]" << endl; return 0; }',
          c: '#include <stdio.h>\nint main() { printf("Indices: [0, 1]\\n"); return 0; }',
          java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Indices: [0, 1]");\n    }\n}'
        }
      },
      reverse_ll: {
        title: "8. Reverse Linked List",
        diff: "HARD",
        desc: "Reverse 1 -> 2 -> 3 -> NULL to 3 -> 2 -> 1 -> NULL.",
        code: {
          html: "<script>\ndocument.write('Reversed LL: 3 -> 2 -> 1 -> NULL');\n<\/script>",
          python: "print('Reversed:', '3 -> 2 -> 1 -> NULL')",
          javascript: "console.log('Reversed Linked List:', '3 -> 2 -> 1 -> NULL');",
          cpp: '#include <iostream>\nusing namespace std;\nint main() { cout << "3 -> 2 -> 1 -> NULL" << endl; return 0; }',
          c: '#include <stdio.h>\nint main() { printf("3 -> 2 -> 1 -> NULL\\n"); return 0; }',
          java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Reversed: 3 -> 2 -> 1 -> NULL");\n    }\n}'
        }
      }
    };

    function loadProblem() {
      const probKey = document.getElementById('problemSelect').value;
      const langKey = document.getElementById('langSelect').value;
      const prob = problems[probKey];

      document.getElementById('probTitle').innerText = prob.title;
      document.getElementById('probDiff').innerText = prob.diff;
      document.getElementById('probDesc').innerText = prob.desc;
      document.getElementById('fileExt').innerText = `main.${langKey === 'javascript' ? 'js' : langKey}`;

      const diffBadge = document.getElementById('probDiff');
      if (prob.diff === 'EASY') diffBadge.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-green-950 text-cyber-accent border border-cyber-accent';
      else if (prob.diff === 'MEDIUM') diffBadge.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-yellow-950 text-yellow-300 border border-yellow-500';
      else diffBadge.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-red-950 text-red-400 border border-red-500';

      document.getElementById('codeEditor').value = prob.code[langKey] || '// Snippet unavailable.';
    }

    function executeCode() {
      const lang = document.getElementById('langSelect').value;
      const code = document.getElementById('codeEditor').value;
      const htmlFrame = document.getElementById('htmlPreview');
      const consoleTerm = document.getElementById('consoleTerminal');

      if (lang === 'html') {
        consoleTerm.classList.add('hidden');
        htmlFrame.classList.remove('hidden');
        htmlFrame.srcdoc = code;
      } else {
        htmlFrame.classList.add('hidden');
        consoleTerm.classList.remove('hidden');
        consoleTerm.innerHTML = `<div class="text-cyber-cyan">&gt; executing ${lang} script...</div><div class="text-gray-500 text-[11px] mb-2">[Processing Kernel Target...]</div>`;

        setTimeout(() => {
          try {
            if (lang === 'javascript') {
              let logs = [];
              const customConsole = {
                log: (...args) => logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '))
              };
              new Function('console', code)(customConsole);
              consoleTerm.innerHTML += `<div class="text-cyber-accent font-bold">${logs.join('\n') || '&gt; Execution complete with no output.'}</div>`;
            } else {
              let output = simulateOutput(code);
              consoleTerm.innerHTML += `<div class="text-cyber-accent">${output}</div>`;
            }
            consoleTerm.innerHTML += `<div class="text-gray-600 text-[10px] mt-3">&gt; Process finished [Status: 0]</div>`;
          } catch (err) {
            consoleTerm.innerHTML += `<div class="text-red-400 font-bold">[Execution Failed]:\n${err.message}</div>`;
          }
        }, 300);
      }
    }

    function simulateOutput(code) {
      if (code.includes('Hello, World!')) return 'Hello, World!';
      if (code.includes('Sum')) return 'Sum of 15 + 25 = 40';
      if (code.includes('Even') || code.includes('Odd')) return '42 is Even';
      if (code.includes('Factorial')) return 'Factorial of 5: 120';
      if (code.includes('Palindrome')) return 'madam is Palindrome: True';
      if (code.includes('Fibonacci')) return 'Fibonacci: 0, 1, 1, 2, 3, 5, 8, 13';
      if (code.includes('Indices')) return 'Indices: [0, 1]';
      if (code.includes('Reversed')) return 'Reversed: 3 -> 2 -> 1 -> NULL';
      return '&gt; Program executed successfully.';
    }

    function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('hidden'); }
    function clearConsole() { document.getElementById('consoleTerminal').innerHTML = '<div class="text-gray-500 italic">&gt; Console cleared.</div>'; }
    function resetEditor() { loadProblem(); toggleMenu(); }
    function openMusicModal() { document.getElementById('musicModal').classList.remove('hidden'); toggleMenu(); }
    function closeMusicModal() { document.getElementById('musicModal').classList.add('hidden'); }

    window.onload = function() {
      loadProblem();
      executeCode();
    };
  </script>
</body>
</html>
